[project]
name = "enterprise-knowledge-qa"
version = "0.1.0"
description = "企业知识库智能客服系统（初级版）"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "asyncpg>=0.29,<1.0",
  "alembic>=1.13,<2.0",
  "pydantic-settings>=2.5,<3.0",
  "python-multipart>=0.0.9,<1.0",
  "pypdf>=5.0,<6.0",
  "openai>=1.50,<2.0",
  "qdrant-client>=1.12,<1.13",
  "arq>=0.26,<1.0",
  "redis>=5.0,<6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.8", "mypy>=1.13"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
cache_dir = ".cache/pytest"
addopts = "--basetemp=.cache/pytest-tmp"

[tool.ruff]
line-length = 100
target-version = "py312"
cache-dir = ".cache/ruff"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"app/services/auth.py" = ["B008"]
"app/routers/*.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []
cache_dir = ".cache/mypy"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
